name: Extract ZIP and commit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate archive
        id: find
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' -print -quit)
          [ -n "$ZIP" ] || { echo "::error::No .zip found"; exit 1; }
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract archive
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -o "${{ steps.find.outputs.zip }}" -d extracted/

      - name: Commit extracted files
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Extract $(basename "${{ steps.find.outputs.zip }}") [skip ci]"
            git push
          fi
