name: PS-HR one-file validation

# Paste this single file into an EMPTY GitHub repository at  .github/workflows/pshr.yml  and commit it.
# It contains the whole PS-HR project (compressed, in the 'prepare' job), runs every validation on GitHub's computers
# (x86 and ARM speed, tests, synthetic experiments, real sentence model on Banking77 + CLINC150), then commits all
# results into the repo under  ci-results/  and the project source under  pshr/  so they can be read from GitHub.
# The run starts by itself when the file is committed, and can be restarted from the Actions tab (Run workflow).
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['.github/workflows/pshr.yml']

jobs:
  prepare:
    runs-on: ubuntu-latest
